name: Manual Auto Tag & Release

on:
  workflow_dispatch:  # 手动触发

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.23

      - name: Generate tag name
        id: tag
        run: |
          DATE=$(date +'%Y.%m.%d')
          SHORT_SHA=$(git rev-parse --short HEAD)
          TAG="v${DATE}-${SHORT_SHA}"
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          echo "Generated tag: $TAG"

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0

      - name: Build binaries
        run: |
          mkdir -p dist
          echo "🔨 Building for Linux amd64 (static)..."
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            CC="zig cc -target x86_64-linux-gnu" \
            CXX="zig c++ -target x86_64-linux-gnu" \
            go build -ldflags="-s -w -extldflags=-static" -o dist/RS-backend-linux-amd64 ./main.go
          echo "🔨 Building for Windows amd64 (static)..."
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
            CC="zig cc -target x86_64-windows-gnu" \
            CXX="zig c++ -target x86_64-windows-gnu" \
            go build -ldflags="-s -w -extldflags=-static" -o dist/RS-backend-windows-amd64.exe ./main.go
          echo "🔨 Building for Linux arm64 (static)..."
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
            CC="zig cc -target aarch64-linux-gnu" \
            CXX="zig c++ -target aarch64-linux-gnu" \
            go build -ldflags="-s -w -extldflags=-static" -o dist/RS-backend-linux-arm64 ./main.go

      - name: Create Git tag
        run: |
          git tag ${{ steps.tag.outputs.TAG }}
          git push origin ${{ steps.tag.outputs.TAG }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag.outputs.TAG }}
          name: Release ${{ steps.tag.outputs.TAG }}
          body: |
            🚀 Auto-generated release **${{ steps.tag.outputs.TAG }}**

            Includes binaries for:
            - Linux amd64
            - Windows amd64
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
